<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SupportOps API | Login</title>

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-header">
        <h1>SupportOps</h1>
        <p>Login or create an account to manage support tickets.</p>
      </div>

      <div class="auth-tabs">
        <button class="tab-button active" id="login-tab">Login</button>
        <button class="tab-button" id="register-tab">Register</button>
      </div>

      <form class="auth-form" id="login-form">
        <h2>Login</h2>

        <div class="form-group">
          <label for="login-username">Username</label>
          <input
            type="text"
            id="login-username"
            name="username"
            placeholder="Enter your username"
            required
          />
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input
            type="password"
            id="login-password"
            name="password"
            placeholder="Enter your password"
            required
          />
        </div>

        <button type="submit" class="primary-button">Login</button>

        <p class="form-message" id="login-message"></p>
      </form>

      <form class="auth-form hidden" id="register-form">
        <h2>Register</h2>

        <div class="form-group">
          <label for="register-username">Username</label>
          <input
            type="text"
            id="register-username"
            name="username"
            placeholder="Choose a username"
            required
          />
        </div>

        <div class="form-group">
          <label for="register-email">Email</label>
          <input
            type="email"
            id="register-email"
            name="email"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="form-group">
          <label for="register-password">Password</label>
          <input
            type="password"
            id="register-password"
            name="password"
            placeholder="Choose a password"
            required
          />
        </div>

        <button type="submit" class="primary-button">Create Account</button>

        <p class="form-message" id="register-message"></p>
      </form>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
